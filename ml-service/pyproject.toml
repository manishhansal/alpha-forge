[project]
name = "alphaforge-ml"
version = "0.1.0"
description = "Multi-model AI decision engine for Indian market trading"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "xgboost==2.1.3",
    "lightgbm==4.5.0",
    "catboost==1.2.7",
    "stable-baselines3==2.4.0",
    "gymnasium==1.0.0",
    "shap==0.46.0",
    "pypfopt==1.5.5",
    "scipy==1.14.1",
    "joblib==1.4.2",
    "pydantic==2.10.3",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "ta==0.11.0",
    "optuna==4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
