services:
  postgres:
    # NOTE: stay on the debian-based tag, not `17-alpine`. Alpine 3.23's musl
    # binaries fail with "exec format error" on the current WSL2 kernel
    # (6.6.114.1-microsoft-standard-WSL2). Switch back to `17-alpine` once WSL
    # ships a newer kernel.
    image: postgres:17
    container_name: alpha-forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_dashboard
    ports:
      # Host 5433 avoids clashing with a native Postgres on 5432. The container
      # still listens on 5432 internally; point DATABASE_URL at host port 5433.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - alphaforge

  redis:
    image: redis:7
    container_name: alpha-forge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - alphaforge

  # ─── ML Service (Python multi-model AI decision engine) ─────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: alpha-forge-ml
    restart: unless-stopped
    environment:
      ML_SERVICE_PORT: "8100"
      ML_LOG_LEVEL: "INFO"
      MODEL_ARTIFACTS_PATH: "/app/artifacts"
      FEATURE_CACHE_TTL: "60"
      # The ML service can call the Next.js app for data if needed
      NEXTJS_API_BASE_URL: "http://host.docker.internal:3000/api/in"
      # Scrapling data service — Tier 0 OHLCV source for ML training pipeline
      DATA_SERVICE_URL: "http://data-service:8200"
    ports:
      - "8100:8100"
    volumes:
      # Persist trained model artifacts across container restarts
      - ml_artifacts:/app/artifacts
      # Training data (optional — mount local data for training runs)
      - ./ml-service/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8100/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    # Resource limits — ML models are memory-hungry
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    networks:
      - alphaforge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-service:
        condition: service_started

  # ─── Data Service (Python Scrapling-based market data scraper) ──────────────
  data-service:
    build:
      context: ./data-service
      dockerfile: Dockerfile
    container_name: alpha-forge-data
    restart: unless-stopped
    # Chromium's built-in async DNS resolver refuses loopback addresses, so it
    # cannot use Docker's default 127.0.0.11 nameserver.  Override with Google's
    # public DNS so Playwright can resolve external hostnames.
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      DATA_SERVICE_PORT: "8200"
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/data
      SCRAPLING_HEADLESS: "true"
      NSE_RATE_LIMIT: "3"
      BSE_RATE_LIMIT: "2"
      BAN_BACKOFF_SECONDS: "60"
      SCRAPLING_PROXY_URL: ""
    ports:
      - "8200:8200"
    volumes:
      - data_service_cache:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8200/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - alphaforge
    depends_on:
      redis:
        condition: service_healthy

  # ─── Integration profile: Next.js Application ────────────────────────────────
  # Only started with: docker compose --profile integration up
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: alpha-forge-app
    restart: unless-stopped
    profiles:
      - integration
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://crypto:crypto@postgres:5432/crypto_dashboard
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8100
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health/ready | grep -q '\"status\"' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - alphaforge

  # ─── Integration profile: Background Worker ───────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: alpha-forge-worker
    restart: unless-stopped
    profiles:
      - integration
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://crypto:crypto@postgres:5432/crypto_dashboard
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8100
      WORKER_APP_BASE_URL: http://app:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alphaforge

volumes:
  postgres_data:
  redis_data:
  ml_artifacts:
  data_service_cache:

networks:
  alphaforge:
    driver: bridge
