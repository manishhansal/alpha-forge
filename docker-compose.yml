services:
  postgres:
    # NOTE: stay on the debian-based tag, not `17-alpine`. Alpine 3.23's musl
    # binaries fail with "exec format error" on the current WSL2 kernel
    # (6.6.114.1-microsoft-standard-WSL2). Switch back to `17-alpine` once WSL
    # ships a newer kernel.
    image: postgres:17
    container_name: alpha-forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_dashboard
    ports:
      # Host 5433 avoids clashing with a native Postgres on 5432. The container
      # still listens on 5432 internally; point DATABASE_URL at host port 5433.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - alphaforge

  redis:
    image: redis:7
    container_name: alpha-forge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - alphaforge

  # ─── ML Service (ml-service2.0 — external standalone repo) ─────────────────
  # Source: /Users/manishkumar/Desktop/ml-service2.0
  # The old ./ml-service has been retired. ml-service2.0 is the canonical
  # multi-model AI decision engine for AlphaForge Phase 3/4.
  ml-service:
    build:
      context: ../ml-service2.0
      dockerfile: Dockerfile
    container_name: alpha-forge-ml
    restart: unless-stopped
    environment:
      # ── Service identity ────────────────────────────────────────────────────
      PORT: "8100"
      LOG_LEVEL: "INFO"
      DEPLOYMENT_MODE: "paper"
      # ── Auth ────────────────────────────────────────────────────────────────
      # Must match ML_SERVICE_API_KEY in alpha-forge .env.local
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-ml-key-change-before-prod}
      # ── Upstream data sources ───────────────────────────────────────────────
      # data-service2.0 runs as a separate stack — reach via host gateway
      DATA_SERVICE_2_URL: "http://host.docker.internal:8200"
      DATA_SERVICE_API_KEY: ${DATA_SERVICE_API_KEY:-}
      # SentinelPulse news intelligence service (port 3001)
      SENTINEL_PULSE_URL: "http://host.docker.internal:3001"
      SENTINEL_PULSE_API_KEY: ${SENTINEL_PULSE_API_KEY:-}
      # ── Storage ─────────────────────────────────────────────────────────────
      MODEL_ARTIFACTS_PATH: "/app/artifacts"
      FEATURE_CACHE_TTL: "60"
      NEWS_CONTEXT_CACHE_TTL: "90"
      # ── Redis (shared with AlphaForge) ──────────────────────────────────────
      REDIS_URL: "redis://redis:6379"
      # ── MLflow experiment tracking ──────────────────────────────────────────
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      # ── Model acceptance gates ──────────────────────────────────────────────
      MODEL_ACCEPTANCE_MIN_IC: "0.02"
      MODEL_ACCEPTANCE_MAX_PBO: "0.5"
      EMBARGO_PERIOD_DAYS: "10"
      OPTUNA_N_TRIALS: "50"
    ports:
      - "8100:8100"
    volumes:
      # Persist trained model artifacts across container restarts
      - ml_artifacts:/app/artifacts
      # Audit log persisted to host
      - ./audit.jsonl:/app/audit.jsonl
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8100/health | grep -q healthy || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    # Resource limits — ML models are memory-hungry
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - alphaforge
    depends_on:
      redis:
        condition: service_healthy

  # ─── Integration profile: Next.js Application ────────────────────────────────
  # Only started with: docker compose --profile integration up
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: alpha-forge-app
    restart: unless-stopped
    profiles:
      - integration
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://crypto:crypto@postgres:5432/crypto_dashboard
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8100
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-ml-key-change-before-prod}
      ML_MODE: ${ML_MODE:-fallback}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SENTINEL_PULSE_URL: http://host.docker.internal:3001
      SENTINEL_PULSE_API_KEY: ${SENTINEL_PULSE_API_KEY}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health/ready | grep -q '\"status\"' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - alphaforge

  # ─── Integration profile: Background Worker ───────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: alpha-forge-worker
    restart: unless-stopped
    profiles:
      - integration
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://crypto:crypto@postgres:5432/crypto_dashboard
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8100
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-ml-key-change-before-prod}
      ML_MODE: ${ML_MODE:-fallback}
      WORKER_APP_BASE_URL: http://app:3000
      SENTINEL_PULSE_URL: http://host.docker.internal:3001
      SENTINEL_PULSE_API_KEY: ${SENTINEL_PULSE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alphaforge

  # ─── MLflow tracking server ──────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: alpha-forge-mlflow
    restart: unless-stopped
    command: >
      sh -c "pip install --quiet mlflow==2.19.0 &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri sqlite:///mlruns/mlflow.db
             --default-artifact-root /mlruns/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlruns:/mlruns
    networks:
      - alphaforge

volumes:
  postgres_data:
  redis_data:
  ml_artifacts:
  mlruns:

networks:
  alphaforge:
    driver: bridge
