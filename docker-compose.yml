services:
  postgres:
    # NOTE: stay on the debian-based tag, not `17-alpine`. Alpine 3.23's musl
    # binaries fail with "exec format error" on the current WSL2 kernel
    # (6.6.114.1-microsoft-standard-WSL2). Switch back to `17-alpine` once WSL
    # ships a newer kernel.
    image: postgres:17
    container_name: alpha-forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_dashboard
    ports:
      # Host 5433 avoids clashing with a native Postgres on 5432. The container
      # still listens on 5432 internally; point DATABASE_URL at host port 5433.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - alphaforge

  redis:
    image: redis:7
    container_name: alpha-forge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - alphaforge

  # ─── Integration profile: Next.js Application ────────────────────────────────
  # Only started with: docker compose --profile integration up
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: alpha-forge-app
    restart: unless-stopped
    profiles:
      - integration
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://crypto:crypto@postgres:5432/crypto_dashboard
      REDIS_URL: redis://redis:6379
      # ml-service2.0 is a standalone service managed by its own compose.
      # AlphaForge reaches it via host gateway — same pattern as data-service and SentinelPulse.
      ML_SERVICE_URL: http://host.docker.internal:8100
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-ml-key-change-before-prod}
      ML_MODE: ${ML_MODE:-fallback}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SENTINEL_PULSE_URL: http://host.docker.internal:3001
      SENTINEL_PULSE_API_KEY: ${SENTINEL_PULSE_API_KEY}
    ports:
      - "3000:3000"
    healthcheck:
      # The /api/health/ready endpoint requires auth from outside.
      # Probe the root page — always returns 200 when the Next.js server is up.
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ | grep -q 'DOCTYPE\\|html\\|AlphaForge' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - alphaforge

  # ─── Integration profile: Background Worker ───────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: alpha-forge-worker
    restart: unless-stopped
    profiles:
      - integration
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://crypto:crypto@postgres:5432/crypto_dashboard
      REDIS_URL: redis://redis:6379
      # ml-service2.0 is a standalone service managed by its own compose.
      ML_SERVICE_URL: http://host.docker.internal:8100
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-ml-key-change-before-prod}
      ML_MODE: ${ML_MODE:-fallback}
      WORKER_APP_BASE_URL: http://app:3000
      SENTINEL_PULSE_URL: http://host.docker.internal:3001
      SENTINEL_PULSE_API_KEY: ${SENTINEL_PULSE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - alphaforge

volumes:
  postgres_data:
  redis_data:

networks:
  alphaforge:
    driver: bridge
