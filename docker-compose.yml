services:
  postgres:
    # NOTE: stay on the debian-based tag, not `17-alpine`. Alpine 3.23's musl
    # binaries fail with "exec format error" on the current WSL2 kernel
    # (6.6.114.1-microsoft-standard-WSL2). Switch back to `17-alpine` once WSL
    # ships a newer kernel.
    image: postgres:17
    container_name: alpha-forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_dashboard
    ports:
      # Host 5433 avoids clashing with a native Postgres on 5432. The container
      # still listens on 5432 internally; point DATABASE_URL at host port 5433.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: alpha-forge-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── ML Service (Python multi-model AI decision engine) ─────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: alpha-forge-ml
    restart: unless-stopped
    environment:
      ML_SERVICE_PORT: "8100"
      ML_LOG_LEVEL: "INFO"
      MODEL_ARTIFACTS_PATH: "/app/artifacts"
      FEATURE_CACHE_TTL: "60"
      # The ML service can call the Next.js app for data if needed
      NEXTJS_API_BASE_URL: "http://host.docker.internal:3000/api/in"
    ports:
      - "8100:8100"
    volumes:
      # Persist trained model artifacts across container restarts
      - ml_artifacts:/app/artifacts
      # Training data (optional — mount local data for training runs)
      - ./ml-service/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8100/health'); r.raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    # Resource limits — ML models are memory-hungry
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

volumes:
  postgres_data:
  redis_data:
  ml_artifacts:
